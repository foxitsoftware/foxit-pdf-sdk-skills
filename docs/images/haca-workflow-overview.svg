<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">4-Stage Human-AI Collaboration Workflow</title>
  <desc id="desc">双泳道展示 Human 与 Agent 在四个阶段的核心职责和交接点。</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 30px 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
      .subtitle { font: 500 15px 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #4b5563; }
      .lane { font: 700 18px 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
      .step { font: 700 14px 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
      .text { font: 500 13px 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #374151; }
      .note { font: 500 12px 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #6b7280; }
      .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; rx: 10; }
      .handoff { fill: #ffffff; stroke: #93c5fd; stroke-width: 1.2; rx: 10; }
      .divider { stroke: #e5e7eb; stroke-width: 1.2; }
      .hline { stroke: #f3f4f6; stroke-width: 1; }
      .arrow { stroke: #2563eb; stroke-width: 1.8; fill: none; marker-end: url(#arrowBlue); }
      .vflow { stroke: #9ca3af; stroke-width: 1.5; fill: none; marker-end: url(#arrowGray); }
    </style>

    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb" />
    </marker>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#9ca3af" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="760" />
  <text class="title" x="52" y="62">4-Stage Human-AI Collaboration Workflow</text>
  <text class="subtitle" x="52" y="88">每步保留最小信息：谁负责什么，如何交接</text>

  <text class="lane" x="70" y="132">Human</text>
  <text class="lane" x="660" y="132">Agent</text>
  <line class="divider" x1="600" y1="110" x2="600" y2="670" />

  <line class="hline" x1="50" y1="170" x2="1150" y2="170" />
  <line class="hline" x1="50" y1="295" x2="1150" y2="295" />
  <line class="hline" x1="50" y1="420" x2="1150" y2="420" />
  <line class="hline" x1="50" y1="545" x2="1150" y2="545" />

  <text class="step" x="52" y="160">Step 1 需求澄清</text>
  <rect class="box" x="60" y="178" width="500" height="92" />
  <text class="text" x="78" y="208">• 提供目标/约束/验收标准</text>
  <text class="text" x="78" y="232">• 确认阻断问题</text>
  <rect class="box" x="640" y="178" width="500" height="92" />
  <text class="text" x="658" y="208">• 批量提问并识别缺口</text>
  <text class="text" x="658" y="232">• 输出 Task Input + 决策摘要 v0</text>
  <rect class="handoff" x="520" y="240" width="160" height="28" />
  <text class="note" x="536" y="259">确认后进入 Step 2</text>
  <path class="arrow" d="M560 224 L640 224" />

  <text class="step" x="52" y="285">Step 2 方案设计</text>
  <rect class="box" x="60" y="303" width="500" height="92" />
  <text class="text" x="78" y="333">• 评审方案与关键假设</text>
  <text class="text" x="78" y="357">• 决策未覆盖场景</text>
  <rect class="box" x="640" y="303" width="500" height="92" />
  <text class="text" x="658" y="333">• 设计方案并识别风险</text>
  <text class="text" x="658" y="357">• 迭代消解并输出完整摘要</text>
  <rect class="handoff" x="520" y="365" width="160" height="28" />
  <text class="note" x="536" y="384">确认后进入 Step 3</text>
  <path class="arrow" d="M560 349 L640 349" />

  <text class="step" x="52" y="410">Step 3 子任务拆分</text>
  <rect class="box" x="60" y="428" width="500" height="92" />
  <text class="text" x="78" y="458">• 确认颗粒度与依赖顺序</text>
  <text class="text" x="78" y="482">• 确认 Step 4 执行模式</text>
  <rect class="box" x="640" y="428" width="500" height="92" />
  <text class="text" x="658" y="458">• 输出子任务列表与执行顺序</text>
  <text class="text" x="658" y="482">• 标注代码/配置/测试依赖</text>
  <rect class="handoff" x="520" y="490" width="160" height="28" />
  <text class="note" x="536" y="509">确认后进入 Step 4</text>
  <path class="arrow" d="M560 474 L640 474" />

  <text class="step" x="52" y="535">Step 4 Build</text>
  <rect class="box" x="60" y="553" width="1080" height="82" />
  <text class="text" x="78" y="582">• Agent：按序执行与提交</text>
  <text class="text" x="360" y="582">• Human：高效模式处理异常确认；严格模式逐提交确认</text>
  <text class="note" x="78" y="607">异常回退：技术障碍→Step 2；依赖错误→Step 3；需求变更→Step 1</text>

  <path class="vflow" d="M600 268 L600 303" />
  <path class="vflow" d="M600 393 L600 428" />
  <path class="vflow" d="M600 518 L600 553" />
</svg>

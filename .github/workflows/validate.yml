name: validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate HACA customizations (Copilot tree)
        run: python3 scripts/sync_haca_customizations.py --check

      - name: Self-test commit-message validators
        run: |
          cat > /tmp/sample-commit-msg.txt <<'EOF'
          [AI] feat(skills): add Copilot validation gate

          ## Task Input
          Validate the .github customization tree on CI.

          ## AI Decision Summary
          - Requirement description: Block commits that break the Copilot tree.
          - Requirement understanding: Run the validator and commit-message self-tests.
          - Adopted approach: GitHub Actions workflow calling existing scripts.
          - Rejected approach: Keep the removed cross-platform sync tool.
          - Key assumptions: The repo targets GitHub Copilot only.
          - Known risks: N/A
          - Uncovered scenarios: N/A
          EOF
          python3 .github/skills/commit-message-rules/scripts/verify_commit_message.py /tmp/sample-commit-msg.txt
          python3 .github/skills/commit-message-rules/scripts/check_commit_message_length.py /tmp/sample-commit-msg.txt